[package]
name = "remotehand-notes"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Private Vault-backed sticky notes for RemoteHand"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "remotehand-notes"
path = "src/main.rs"
